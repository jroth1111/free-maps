name: Production Lighthouse matrix

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed origin to audit
        required: true
        default: https://free-maps.forkandflag.com
      worker_version_override_id:
        description: Optional 0%-traffic Worker version to audit through the production hostname
        required: false
        default: ""
      expected_commit:
        description: Optional exact commit expected from /api/health
        required: false
        default: ""
      routes:
        description: Comma-separated routes
        required: true
        default: /,/embed/,/states/,/vanilla/,/react/
      profiles:
        description: Comma-separated profiles
        required: true
        default: mobile,ipad,desktop
      modes:
        description: Comma-separated cold and warm modes
        required: true
        default: cold,warm
      runs:
        description: Runs per route/profile/mode
        required: true
        default: "3"

permissions:
  contents: read

concurrency:
  group: free-maps-production-lighthouse
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Chrome for Testing
        run: npx @puppeteer/browsers install chrome@151.0.7922.34 --path .cache/chrome
      - name: Resolve Chrome path
        run: echo "CHROME_PATH=$(find .cache/chrome -type f -name chrome -print -quit)" >> "$GITHUB_ENV"
      - name: Run serial Lighthouse matrix
        env:
          LIGHTHOUSE_BASE_URL: ${{ inputs.base_url }}
          WORKER_VERSION_OVERRIDE_ID: ${{ inputs.worker_version_override_id }}
          LIGHTHOUSE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          LIGHTHOUSE_ROUTES: ${{ inputs.routes }}
          LIGHTHOUSE_PROFILES: ${{ inputs.profiles }}
          LIGHTHOUSE_MODES: ${{ inputs.modes }}
          LIGHTHOUSE_RUNS: ${{ inputs.runs }}
        run: npm run lighthouse:matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-13.4.0-chrome-151.0.7922.34
          path: artifacts/lighthouse-v0.3.0/
